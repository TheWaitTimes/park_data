name: Collect WDW Wait Times

on:
  schedule:
    # Run every 30 minutes during the typical WDW park operating window.
    # GitHub cron is UTC, so this matches the daytime/evening park hours
    # while still letting the script skip parks that are closed.
    - cron: '0,30 13-23 * * *'
    - cron: '0,30 0-4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wait-times-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Collect wait times
        run: python scripts/collect_wait_times.py

      - name: Commit and push data
        run: |
          git config user.name "wait-times-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data this run."
          else
            git commit -m "Wait times $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
