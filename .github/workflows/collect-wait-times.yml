name: Collect WDW Wait Times

on:
  schedule:
    - cron: '7,37 13-23 * * *'
    - cron: '7,37 0-4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wait-times-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Log collection start
        run: |
          echo "Collection started"
          echo "UTC time: $(date -u)"
          echo "Event: ${{ github.event_name }}"
          echo "Run ID: ${{ github.run_id }}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Collect wait times
        run: python scripts/collect_wait_times.py

      - name: Commit and push data
        run: |
          git config user.name "wait-times-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Wait times $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Log collection completion
        if: always()
        run: |
          echo "Collection job finished"
          echo "UTC time: $(date -u)"
          echo "Job status: ${{ job.status }}"
